version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns:
        - '*'
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      npm:
        patterns:
        - '*'
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: themes/parsa
    cooldown:
      exclude:
        - projektemacher-base

  - package-ecosystem: "npm"
    directory: "/Source Files/Mocks/"
    versioning-strategy: increase
    schedule:
      interval: "weekly"
    groups:
      npm-mocks:
        patterns:
          - "*"
